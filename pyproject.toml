[project]
name = "agent-platform"
version = "0.4.1"
description = "An integrated AI platform: authenticated API, LLM gateway, tool-using agents, durable multi-agent jobs, tenant-isolated retrieval, tracing, and evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "llm-gateway",
    "hybrid-rag",
    "ann-vector-search-library",
    "evaluation-harness",
    "llm-observability",
    "numpy>=1.26",
]

[project.scripts]
agent-platform = "agent_platform.cli:main"

[tool.uv.sources]
llm-gateway = { git = "https://github.com/adeoluo/llm-gateway" }
hybrid-rag = { git = "https://github.com/adeoluo/hybrid-rag" }
ann-vector-search-library = { git = "https://github.com/adeoluo/ann-vector-search-library" }
evaluation-harness = { git = "https://github.com/adeoluo/evaluation-harness" }
llm-observability = { git = "https://github.com/adeoluo/llm-observability" }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_platform",
    "vendor/agent_memory",
    "vendor/constrained_generation_library",
    "vendor/multi_agent_orchestrator",
    "vendor/react_agent",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agent_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: long-running tests excluded from continuous integration",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
